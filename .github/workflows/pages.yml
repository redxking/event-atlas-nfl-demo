name: Refresh and deploy public NFL demo
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: npm run sync:sports
      - run: npm run build:site
      - run: npm run sync:cameras
      - run: npm run sync:news
      - run: npm run sync:game-articles
      - run: npm run sync:roads
      - run: npm run sync:spc
      - run: npm run sync:wpc-rain
      - run: npm run sync:police
      - run: npm run sync:charlotte-police
      - run: npm run sync:arlington-police
      - run: npm run sync:denver-police
      - run: npm run sync:philly-alerts
      - run: npm run sync:green-bay-alerts
      - run: npm run sync:lambeau-plan
      - run: npm run sync:packers-release
      - run: npm run sync:patriots-preview
      - run: npm run sync:jets-guide
      - run: npm run sync:seahawks-guide
      - run: npm run sync:titans-guide
      - run: npm run sync:falcons-guide
      - run: npm run sync:saints-guide
      - run: npm run sync:norta-alerts
      - run: npm run sync:marta-rail
      - run: npm run sync:marta-alert-preview
      - run: npm run sync:georgia-traffic
      - run: npm run sync:sound-transit-seahawks
      - run: npm run sync:sound-transit-alerts
      - run: npm run sync:seattle-fire
      - run: npm run sync:nashville-police
      - run: npm run sync:philly-permits
      - run: npm run sync:njtransit-rail
      - run: npm run sync:nj511
      - run: npm run sync:ntas
      - run: npm run sync:eonet
      - run: npm run sync:nifc
      - run: npm run sync:airnow
      - run: npm run sync:hms-smoke
      - run: npm run sync:septa
      - run: npm run sync:seams
      - run: npm run sync:tfr
      - run: npm run build:reports
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
